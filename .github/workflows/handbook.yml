# Public handbook pipeline: checks on every pull request, build and deploy on
# main, nightly rebuild (spokes change outside the hub; the cron catches that).
name: handbook

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Sync environment (locked versions)
        run: uv sync --frozen

      - name: Import list in sync with the inventory
        run: uv run python scripts/gen_imports.py --check

      - name: Agent seeds in sync with the canonical source (drift gate)
        run: uv run python scripts/gen_agent_seeds.py --check

      # Before the gate it tests, deliberately. If the gate's own logic is
      # broken, that is what you want to read first -- a green contract check
      # from a broken checker says nothing. This selftest ran in no CI step
      # until 2026-09-22 and had been red on main for exactly that reason.
      - name: Gate selftest (the checker's own logic)
        run: uv run python scripts/check_agent_tools.py --selftest

      - name: Agent-tool/skill contract (allow/deny + skills per facet)
        run: uv run python scripts/check_agent_tools.py

      - name: Public build (strict)
        run: uv run mkdocs build --strict

      - name: Docs contract of the imported repos
        run: uv run python scripts/check_contract.py

      - name: Freshness (a warning, not a gate)
        run: uv run python scripts/check_freshness.py docs

      - name: MCP session test (handbook-mcp spec delta)
        run: uv run python scripts/test_mcp.py

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
